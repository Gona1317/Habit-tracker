<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HabitFlow</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<script src="supabase-config.js"></script>
<script src="supabase.js"></script>
</head>
<body>
<div id="boot"><div class="bootLogo">✓</div><div class="bootName">HabitFlow</div></div>

<div id="auth" class="hidden">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="authWrap">
    <div class="authLogo">✓</div>
    <h1 id="authTitle">Welcome back</h1>
    <p class="authSub">Build streaks. Level up. Your habits follow you across every device.</p>
    <div class="seg authSeg"><button id="loginTab" class="on" type="button">Login</button><button id="registerTab" type="button">Register</button></div>
    <div id="authMsg" class="authMsg"></div>
    <form id="authForm" autocomplete="on">
      <label id="nameWrap" class="field hidden"><span>Name</span><input id="authName" placeholder="What should we call you?" autocomplete="name"></label>
      <label class="field"><span>Email</span><input id="authEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required></label>
      <label class="field"><span>Password</span><div class="pw"><input id="authPassword" type="password" minlength="6" autocomplete="current-password" placeholder="At least 6 characters" required><button type="button" id="pwToggle" aria-label="Show password">👁</button></div></label>
      <button class="btn grad block" id="authSubmit" type="submit">Login</button>
    </form>
    <button class="linkBtn" id="guestBtn" type="button">Skip for now — use on this device only</button>
  </div>
</div>

<div id="app" class="hidden">
  <main id="screens">
    <section id="home" class="screen active"></section>
    <section id="plan" class="screen"></section>
    <section id="stats" class="screen"></section>
    <section id="me" class="screen"></section>
  </main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="sheetRoot"></div>
<div id="dialogRoot"></div>
<div id="toast"></div>
<canvas id="confetti"></canvas>
<script src="app.js"></script>
</body>
</html>
